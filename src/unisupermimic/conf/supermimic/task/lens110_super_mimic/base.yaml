        root_pos_std: 0.259344096364356
        body_linvel_std: 0.86448032121452
        term_height: 0.21612008030363
  events:
    startup_context:
      _target_: unilab.managers.EventTermCfg
      func: unisupermimic.tasks.motion_tracking.g1.supermimic.manager_terms.SuperMimicContextEvent
      mode: startup
      params:
        command_name: motion
        asset_cfg: &id003
          _target_: unilab.managers.SceneEntityCfg
          name: robot
        ground_asset_cfg: &id004
          _target_: unilab.managers.SceneEntityCfg
          name: ground
          geom_names:
          - floor
        torso_body_name: torso_yaw_link
    reset_context:
      _target_: unilab.managers.EventTermCfg
      func: unisupermimic.tasks.motion_tracking.g1.supermimic.manager_terms.SuperMimicContextEvent
      mode: reset
      params:
        command_name: motion
        asset_cfg: *id003
        ground_asset_cfg: *id004
        torso_body_name: torso_yaw_link
    joint_offsets:
      _target_: unilab.managers.EventTermCfg
      func: unisupermimic.tasks.motion_tracking.g1.supermimic.manager_terms.SuperMimicJointOffsetEvent
      mode: reset
      params:
        command_name: motion
